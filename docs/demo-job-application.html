<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARIA Demo Job Application</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 20px; }
    form { display: grid; gap: 14px; }
    label { font-weight: 700; }
    input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; }
    button { padding: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Software Engineer Application</h1>
  <p>Use this page to demonstrate ARIA scanning and autofill.</p>

  <form>
    <label>First Name
      <input id="first_name" name="first_name" type="text" required>
    </label>

    <label>Last Name
      <input id="last_name" name="last_name" type="text" required>
    </label>

    <label>Email Address
      <input id="email" name="email" type="email" required>
    </label>

    <label>Mobile Number
      <input id="phone" name="phone" type="tel" required>
    </label>

    <label>Current Company
      <input id="current_company" name="current_company" type="text">
    </label>

    <label>Current Job Title
      <input id="designation" name="designation" type="text">
    </label>

    <label>Years of Experience
      <input id="experience_years" name="experience_years" type="number">
    </label>

    <label>LinkedIn Profile
      <input id="linkedin" name="linkedin" type="url">
    </label>

    <label>Skills
      <textarea id="skills" name="skills"></textarea>
    </label>

    <label>Resume/CV
      <input id="resume" name="resume" type="file">
    </label>

    <button type="button">Review Application</button>
  </form>
</body>
</html>
